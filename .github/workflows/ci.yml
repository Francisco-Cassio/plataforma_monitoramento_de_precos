name: CI Quality & Test Suite

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: price_monitor_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Instalar astral-sh/uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configurar Python 3.12
        run: uv python install 3.12

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Executar Migrações do Banco
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/price_monitor_test_db
        run: uv run alembic upgrade head

      - name: Executar Suíte de Testes Automatizados
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/price_monitor_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_ci_environment_32bytes_long
          EMAILS_ENABLED: "true"
        run: uv run pytest -v