[project]
name = "plataforma-monitoramento-de-precos"
version = "0.1.0"
description = "Plataforma de monitoramento de preços de e-commerce e alertas inteligentes"
readme = "README.md"
authors = [
    { name = "Francisco-Cassio", email = "franciscodecassiomourao@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.2",
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]